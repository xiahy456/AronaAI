training:
  # 数据配置
  data_path: "raw/training_dialogues.json"
  batch_size: 32  # 每次训练处理的样本数量
  num_workers: 2  #数据加载线程数

  # 优化器配置
  learning_rate: 0.001  # 学习率，用于控制参数更新的步长
  weight_decay: 0.01  # 权重衰减，防止过拟合正则化项
  num_epochs: 50  # 训练轮数，控制整个数据集被遍历的次数

  # 训练策略
  warmup_steps: 1000  # 预热步数，学习率从0逐渐增加到目标值的过程
  gradient_clip: 1.0  # 梯度裁剪

  # 检查点配置
  checkpoint_dir: "./checkpoints" # 模型保存目录
  checkpoint_save_freq: 5  # 每5个epoch保存一次
  checkpoint_keep_last: 3  # 保留数量1 