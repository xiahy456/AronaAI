model:
  # 模型信息
  name: "AronaLM"  # 模型名称

  # 词汇表配置
  vocab_size: 6000 # 词汇表大小
  pad_token_id: 0 # 填充符的id，用于统一序列长度
  eos_token_id: 1 # 结束符的id，用于表示一句话结束
  unk_token_id: 2 # 未知词的id，遇到没见过的词时使用

  # 模型架构参数
  max_seq_length: 128 # 最大序列长
  d_model: 128   # 模型维度256->128
  n_layers: 2 # Transformer层数8->2
  n_heads: 2  # 注意力头数4->2
  d_ff: 256  # 前馈网络维度1024->256
  dropout: 0.1  # 丢弃率

  # 生成参数
  max_gen_length: 128 # 生成回复的最大长度
  temperature: 0.8  # 生成温度，控制回复的随机性
  top_k: 50 # top_k采样
  do_sample: true # 是否使用采样而非贪心搜索
  max_history: 16 # 最大对话历史轮数