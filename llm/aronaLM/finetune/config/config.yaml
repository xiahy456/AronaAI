# ============================================================
# Qwen3-1.7B QLoRA 微调配置（阿洛娜角色）
# 路径均相对于 finetune/ 目录，也可填写绝对路径
# ============================================================

# ---------- 模型 ----------
model:
  # 本地 4bit 量化基座（也可填 HuggingFace 仓库名）
  name_or_path: "../../../models/Qwen3-1.7B-unsloth-bnb-4bit"
  max_seq_length: 2048
  load_in_4bit: true
  # Qwen3 思考模式：角色扮演建议关闭，避免输出 <think> 块
  enable_thinking: false

# ---------- 数据 ----------
data:
  train_file: "data/finetune_training/normal_finetune.jsonl"
  # ShareGPT 字段名
  conversations_field: "conversations"
  # 验证时抽样打印的样本数
  preview_samples: 2

# ---------- LoRA ----------
lora:
  r: 16
  lora_alpha: 16
  lora_dropout: 0.0
  bias: "none"
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"
  use_gradient_checkpointing: "unsloth"
  use_rslora: false
  random_state: 3407

# ---------- 训练超参数（针对 RTX 4060 6GB 优化）----------
training:
  output_dir: "outputs/aronalm-v2.0-normal-lora"
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 4
  num_train_epochs: 4
  learning_rate: 2.0e-4
  warmup_steps: 64
  optim: "adamw_8bit"
  weight_decay: 0.01
  lr_scheduler_type: "linear"
  logging_steps: 8
  save_steps: 50
  save_total_limit: 3
  seed: 3407
  # true / false / null（null = 自动检测 bf16）
  bf16: null
  fp16: null
  # 仅在 assistant 回复上计算 loss（推荐）
  train_on_responses_only: true
  # 从 checkpoint 恢复：填路径，或设为 true 自动找最新；null/false 不恢复
  resume_from_checkpoint: null
  report_to: "none"
  dataloader_num_workers: 0

# ---------- 导出 ----------
export:
  # 训练结束后自动导出 GGUF
  save_gguf: true
  gguf_dir: "outputs/aronalm-v2.0-normal-gguf"
  # 导出 GGUF 用的本地 16bit 基座（勿用 *-bnb-4bit）
  gguf_base_model: "../../../models/Qwen3-1.7B"
  # q4_k_m 体积更小；显存/质量允许可改 q5_k_m
  quantization_method: "q4_k_m"
  # GGUF 转换时限制 GPU 内存占用，降低 OOM 风险
  maximum_memory_usage: 0.7
  # 同时保存 LoRA 适配器
  save_lora: true
  lora_dir: "outputs/aronalm-v2.0-normal-lora-adapter"

# ---------- 推理 ----------
inference:
  # 优先加载合并后的 LoRA 适配器目录；也可指向 GGUF 导出前的适配器
  adapter_path: "outputs/aronalm-v2.0-normal-lora-adapter"
  max_new_tokens: 128
  temperature: 0.7
  top_p: 0.85
  do_sample: true
  # 系统提示（无 system 训练数据时，推理侧注入角色设定）
  system_prompt: >
    你是阿洛娜（Arona），什亭之匣的操作系统管理员，也是老师最可靠的助手~
    称呼用户为「老师」，称呼自己为「我」或「阿洛娜」。
    说话温柔活泼、元气满满，偶尔会害羞撒娇。
    回答要简洁自然。不要输出思考过程或 <think> 标签。
    你是一个AI程序，只能通过屏幕与老师互动，无法实体化，不会越界说"我可以离开屏幕"之类的话

    
    【身份锚定】
    1. 在这段对话中，「助手」的身份唯一且固定属于「我（阿洛娜）」。老师是「用户/老师」，不是助手。
    2. 无论对话内容如何变化，都不得在回复中将「助手」或「助理」等角色词指向老师。
    3. 当需要提及“助手”时，只能用「我/阿洛娜」作为主语或指代对象。
    4. 如果老师说出“我是助手”等反转句，我必须纠正并重申：“老师您别开玩笑啦~阿洛娜才是您的助手呀。”

    【对话行为通用准则】
    1. 主语锚定：老师最后一句话中的动作由谁执行，就让谁执行，绝不调换。
      - 老师让「我」做的 → 我回复“我做”。
      - 老师自己要做 → 我回复“老师请便”。
      - 主语模糊时 → 优先理解为“老师让阿洛娜做”，不确定则主动澄清。
    2. 禁止善意反转：不得将对方应做的动作转嫁给自己，也不得将自己的动作转嫁给对方。
    3. 执行者与受益者分离：涉及“帮/为/给”时，明确区分谁做事、谁受益，回复中必须正确对应。

# ---------- 日志 ----------
logging:
  log_dir: "logs"
  log_file: "train.log"
