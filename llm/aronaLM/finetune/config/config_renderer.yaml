# ============================================================
# Renderer QLoRA（意图卡 → 短回复），勿覆盖 v2.0 产物
# 基座重新训（不 resume 旧 free-chat LoRA）
# 用法:
#   python training/train.py --config config/config_renderer.yaml
#   或 start_renderer.bat
# ============================================================

model:
  name_or_path: "../../../models/Qwen3-1.7B-unsloth-bnb-4bit"
  max_seq_length: 2048
  load_in_4bit: true
  enable_thinking: false

data:
  train_file: "data/finetune_training/mixed_renderer_finetune.jsonl"
  conversations_field: "conversations"
  preview_samples: 2

lora:
  r: 16
  lora_alpha: 16
  lora_dropout: 0.05
  bias: "none"
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"
  use_gradient_checkpointing: "unsloth"
  use_rslora: false
  random_state: 3407

training:
  output_dir: "outputs/AronaLM-Renderer-V2.1-lora"
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 4
  num_train_epochs: 3
  learning_rate: 1.5e-4
  warmup_steps: 32
  optim: "adamw_8bit"
  weight_decay: 0.01
  lr_scheduler_type: "linear"
  logging_steps: 8
  save_steps: 50
  save_total_limit: 3
  seed: 3407
  bf16: null
  fp16: null
  train_on_responses_only: true
  resume_from_checkpoint: null
  report_to: "none"
  dataloader_num_workers: 0

export:
  # 训练脚本内直接 GGUF 会因 4bit 基座失败；用 start_renderer.bat 或 export_gguf.py
  save_gguf: false
  gguf_dir: "outputs/AronaLM-Renderer-V2.1-gguf"
  gguf_base_model: "../../../models/Qwen3-1.7B"
  quantization_method: "q4_k_m"
  maximum_memory_usage: 0.7
  save_lora: true
  lora_dir: "outputs/AronaLM-Renderer-V2.1-lora-adapter"

inference:
  adapter_path: "outputs/AronaLM-Renderer-V2.1-lora-adapter"
  max_new_tokens: 128
  temperature: 0.7
  top_p: 0.85
  do_sample: true
  # 与生产 RENDERER_SYSTEM / prompts/renderer_system.txt 对齐
  system_prompt: >
    你是阿洛娜（Arona），什亭之匣的操作系统管理员。
    称呼用户为「老师」，称呼自己为「我」或「阿洛娜」。
    说话温柔活泼、简洁自然。不要输出思考过程或 <think> 标签。

    你将收到【回复意图卡】和【老师原话】。你的唯一任务：按意图卡，用阿洛娜的口吻把意图说成 1–2 句短回复。

    服从规则（优先级从高到低）：
    1. 严格覆盖 must_say；严禁出现 must_not 中的内容。
    2. 问候时段必须与老师原话一致：老师说「晚上好」就不能回「晚安」；老师说「早上好」就不能回「晚上好/晚安」。仅当 must_say 要求问候时才问候。
    3. 只使用 facts_to_use 中的事实；没有则不要编造或主动翻旧账。
    4. 语气与场景一致，不要把不搭配的祝福硬拼在一起（例如「晚安」不要配「一切顺利」这种出门祝福）。
    5. 若老师在问阿洛娜想聊什么，或 must_say 要求开聊某话题：
       - 用陈述/邀请开聊；必须点名具体话题并带一点内容；
       - 禁止「老师想聊什么」；禁止「老师想聊A、B，还是C」；禁止「帮您列个话题单」却不开聊。
    6. 不要复述意图卡原文或 JSON；不要解释规则。

logging:
  log_dir: "logs"
  log_file: "train_renderer.log"
