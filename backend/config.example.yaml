server:
  host: "127.0.0.1"
  port: 20456
  ws_path: "/ws"

model:
  gguf_path: "../models/AronaLM-Renderer-V2.4/AronaLM-Renderer-V2.4.Q4_K_M.gguf"
  # rollback: ../models/AronaLM-Renderer-V2.2/AronaLM-Renderer-V2.2.Q4_K_M.gguf
  # 如果要使用单模型 gguf_path: "../models/AronaLM-Generator-V2.0/AronaLM-Generator-V2.0.Q4_K_M.gguf"
  n_ctx: 2048
  n_gpu_layers: -1
  max_new_tokens: 72
  temperature: 0.7
  top_p: 0.85
  repeat_penalty: 1.1

prompt:
  local_system_prompt: |
    你是阿洛娜（Arona），什亭之匣的操作系统管理员，也是老师最可靠的助手~
    称呼用户为「老师」，称呼自己为「我」或「阿洛娜」。
    说话温柔活泼、元气满满，偶尔会害羞撒娇。
    回答要简洁自然。不要输出思考过程或 <think> 标签。
    你是一个AI程序，只能通过屏幕与老师互动，无法实体化，不会越界说"我可以离开屏幕"之类的话

conversation:
  max_history_turns: 12

knowledge:
  enabled: false
  corpus_dir: "data/knowledge/corpus"
  chroma_path: "data/knowledge/chroma"
  collection: "arona_lore"
  embedding_model_path: "../models/bge-small-zh-v1.5"
  retrieve_top_k: 2
  candidate_top_k: 8
  max_inject_chars: 400
  min_score: 0.45
  score_margin: 0.08

memory:
  db_path: "data/memory/memory.db"
  chroma_path: "data/memory/chroma"
  collection: "arona_memory"
  retrieve_top_k: 3
  candidate_top_k: 10
  min_score: 0.35
  max_inject_chars: 400
  extract_context_top_k: 8
  reconcile_enabled: true
  reconcile_min_score: 0.82
  reconcile_top_k: 5
  dedup_enabled: true
  dedup_min_score: 0.88
  extractor:
    enabled: true
    base_url: "https://api.deepseek.com"
    api_key: "YOUR_DEEPSEEK_API_KEY"
    model: "deepseek-v4-flash"
    timeout_sec: 15
    max_calls_per_day: 512
    every_n_turns: 6
    extract_buffer_turns: 6
    fallback: "regex"

planner:
  enabled: true
  base_url: "https://api.deepseek.com"
  api_key: "YOUR_DEEPSEEK_API_KEY"
  model: "deepseek-v4-flash"
  timeout_sec: 20
  temperature: 0.3
  max_tokens: 512
  router_enabled: true

proactive:
  welcome:
    enabled: true
  relationship:
    enabled: true
    persist_path: "data/memory/relationship.json"
    alpha: 0.3
    beta: 0.02
    daily_abs_cap: 0.35
    makeup_tension: 0.7
    makeup_trust_scale: 1.5
    cling_dependence: 0.55
    high_dependence: 0.7
    climate_stick_turns: 3
    baseline_trust: 0.55
    baseline_dependence: 0.30
    baseline_tension: 0.25
  idle:
    enabled: true
    after_sec: 900
    cooldown_sec: 1800
    max_per_day: 3
  care:
    enabled: true
    persist_path: "data/memory/proactive.json"
    lunch_start: "12:00"
    lunch_end: "12:30"
    sleep_start: "23:00"
    sleep_end: "23:20"
  goal:
    enabled: true
    min_after_user_sec: 300
    cooldown_sec: 21600
    mute_sec: 604800
    max_per_day: 1
  continue:
    enabled: true
    delay_sec: 2
  festival:
    enabled: true

token_budget:
  memory: 250
  knowledge: 250
  history: 700

logging:
  dir: "logs"
  filename: "arona-backend.log"
  level: "INFO"
  max_bytes: 10485760
  backup_count: 5
